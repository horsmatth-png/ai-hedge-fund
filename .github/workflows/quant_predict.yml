name: Quant Price Predictor & 3PM Execution

on:
  schedule:
    # Runs at 15:00 UTC Monday-Friday (matches 3 PM UK session execution)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yfinance python-dotenv numpy groq google-generativeai

      - name: Run Quant Predictor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python quant_predictor_pipeline.py
