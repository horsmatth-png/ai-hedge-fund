name: Two-Stage Quant Engine

on:
  schedule:
    - cron: '15 8 * * 1-5'   # Runs 08:15 AM UK (Morning Watchlist)
    - cron: '0 15 * * 1-5'   # Runs 15:00 PM UK (3 PM Re-Validation Execution)
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance requests python-dotenv edgar-tools google-genai groq
      - name: Execute Pipeline based on Time
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq "08" ]; then
            python main_pipeline.py
          else
            python validate_3pm.py
          fi
