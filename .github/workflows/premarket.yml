name: Global Dual-Stage Quant Engine

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 07:30 UTC = 08:30 AM UK (BST is UTC+1, or GMT is UTC+0 depending on time of year)
    - cron: '00 14 * * 1-5'  # 14:00 UTC = 15:00 PM UK (Accounting for UK clock standard)
  workflow_dispatch:         # Allows manual execution anytime

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests python-dotenv

      - name: Execute Regional Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main_pipeline.py
