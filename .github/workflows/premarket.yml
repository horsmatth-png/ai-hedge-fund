name: Institutional Quant Pipeline

on:
  schedule:
    - cron: '30 8 * * 1-5'
      timezone: 'Europe/London'
    - cron: '00 15 * * 1-5'
      timezone: 'Europe/London'
  workflow_dispatch:
    inputs:
      region:
        description: 'Force region (UK or US). Leave blank to auto-detect by time.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests yfinance pandas numpy lxml python-dotenv groq google-generativeai

      - name: Run Quant Pipeline
        env:
          REGION: ${{ github.event.inputs.region }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python main_pipeline.py
