name: Two-Stage Quant Engine

on:
  schedule:
    - cron: '15 8 * * 1-5'   # Runs 08:15 AM UK (Morning Watchlist)
    - cron: '03 15 * * 1-5'  # Runs 15:03 PM UK (3 PM Re-Validation)
  workflow_dispatch:         # Allows manual execution anytime via GitHub UI/App

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests python-dotenv edgar google-genai groq

      - name: Run Pipeline Script
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "import datetime; h = datetime.datetime.utcnow().hour; print(f'Current UTC Hour: {h}'); import subprocess; subprocess.run(['python', 'main_pipeline.py' if h < 12 else 'validate_3pm.py'])"
