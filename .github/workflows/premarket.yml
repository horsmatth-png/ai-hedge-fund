name: Two-Stage Quant Engine

on:
  schedule:
    - cron: '15 8 * * 1-5'
    - cron: '03 15 * * 1-5'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests python-dotenv edgar google-genai groq

      - name: Determine Run Mode (Morning vs 3 PM Validation)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          HOUR=$(date -u +%H)
          echo "Current UTC Hour: $HOUR"
          
          if [ "$HOUR" -eq "8" ] || [ "$HOUR" -eq "08" ]; then
            echo "Running 08:15 AM Morning Preparation Scan..."
            python main_pipeline.py
          else
            echo "Running 15:00 PM Re-Validation Engine..."
            python validate_3pm.py
          fi
